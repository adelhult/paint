<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <meta name="theme-color" content="#ABDAFC" />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lexend:wght@100..900&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Lexend", sans-serif;
                margin: 0;
                padding: 0;
                color: #151515;
            }

            html {
                scroll-behavior: smooth;
            }

            h1,
            h2,
            h3 {
                font-weight: bold;
                font-style: normal;
                line-height: normal;
            }


            hr {
                position: relative;
                margin-bottom: 1.5rem;
                color: rgba(0, 0, 0, 0.05);
            }

            p {
                max-width: 40rem;
            }

            a {
                color: inherit;
            }
        
            h3 {
                font-weight: normal;
                margin: 0;
                margin-bottom: 0.5rem;
            }

            code {
                font-family: "JetBrains Mono", monospace;
                font-optical-sizing: auto;
                font-weight: normal;
                font-style: normal;
                box-sizing: border-box;
                margin: 0;
            }

            .example-list {
                display: flex;
                flex-direction: column;
                gap: 2rem;
            }

            .example-list-compact {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                flex-direction: row;
                gap: 1rem;
            }

            .example {
                width: 100%;
                position: relative;
                display: grid;
                grid-template-columns: 125px 3fr;
                column-gap: 1rem;
                justify-items: start;
            }

            .example-compact {
                width: auto;
                display: flex;
                flex-direction: column;
            }

            .example .code-snippet {
                overflow-x: auto;
                max-width: 100%;
            }

            .example p {
                max-width: 500px;
            }

            .example > h3 {
                grid-row: 1;
                grid-column: 1 / -1;

            }

            .example > .text {
                width: 100%;
                grid: row 2;
                grid-column: 2 / 3;
                min-width: 0;
            }

            .example .canvas {
                grid-row: 2 / 3;
                grid-column: 1 / 2;
            }


            main {
                position: relative;
                max-width: 800px;
                margin-left: auto;
                margin-right: auto;
                box-sizing: border-box;
                padding: 0.5rem;
                margin-bottom: 30vh;
            }

            button {
                -webkit-appearance: none;
                appearance: none;
                border-radius: 4px;
                border: solid 1px rgb(216, 230, 239);
                font-weight: bold;
                font-family: inherit;
                padding: 0.5rem;
                box-sizing: border-box;
                background: #ebf6fe;
                cursor: pointer;
                transition: background 0.2s;
            }

            button:hover {
                background: #ddf1ff;
            }

            button:active {
                background: #ddf1ff;
            }



            .logo-background {
                position: relative;
                box-sizing: border-box;
                padding: 1.5rem;
                padding-bottom: 3rem;
                margin-bottom: -1.5rem;
                background-color: #abdafc;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                gap: 0.2rem;
            }

            .logo {
                max-width: 330px;
            }

            .menu-container {
                top: 0;
                position: sticky;
                padding: 0.8rem;
                display: flex;
                justify-content: center;
                background-color: #ebf6fe;
                box-sizing: border-box;
                margin-bottom: 1.5rem;
                z-index: 10;
            }

            menu {
                list-style: none;
                display: flex;
                gap: 1rem;
                justify-content: center;
                margin: 0rem;
                padding: 0;
            }

            a.anchor {
                display: block;
                position: relative;
                top: -100px;
                visibility: hidden;
            }

            menu > a {
                text-decoration: none;
                font-weight: bold;
                padding: 0.3rem;
                box-sizing: border-box;
                border-radius: 5px;
                transition: background 0.2s;
            }

            menu > a:hover {
                background: rgba(0, 0, 0, 0.05);
            }

            menu > a:active {
                background: rgba(0, 0, 0, 0.05);
            }

            menu span {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            summary {
                font-weight: bold;
                cursor: pointer;
                padding: 0.5rem;
                box-sizing: border-box;
                border-bottom: solid 1px rgba(0, 0, 0, 0.05);
                margin-bottom: 0.5rem;
                user-select: none;
            }

            @media (max-width: 680px) {
                .menu-container {
                    position: relative;
                    justify-content: flex-start;
                }

                menu {
                    flex-direction: column;
                }

                a.anchor {
                    top: -10px;
                }

                .example .canvas {
                    grid-row: 2;
                    grid-column: 1 / -1;
                }

                .example > .text {
                    grid-row: 3;
                    grid-column: 1 / -1;
                }
            }

        </style>
        <script type="module">
            import hljs from "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/es/highlight.min.js";
            import gleam from "https://cdn.jsdelivr.net/npm/@gleam-lang/highlight.js-gleam@1.5.0/+esm";
            hljs.registerLanguage("gleam", gleam);

            class HighlightedCode extends HTMLElement {
                static observedAttributes = ["code"];

                constructor() {
                    super();
                    this.pre = document.createElement("pre");
                    const template =
                        document.getElementById("highlight-styles");
                    this.shadow = this.attachShadow({ mode: "open" });
                    this.shadow.appendChild(template.content.cloneNode(true));
                    this.shadow.appendChild(this.pre);
                }

                attributeChangedCallback(name, _oldValue, newValue) {
                    if (name === "code") {
                        this.pre.innerHTML = hljs.highlight(newValue, {
                            language: "gleam",
                            ignoreIllegals: true,
                        }).value;
                    }
                }
            }
            window.customElements.define("highlighted-code", HighlightedCode);
        </script>
        <title>Paint</title>
        <script type="module" src="/priv/static/demo.mjs"></script>
    </head>
    <body>
        <template id="highlight-styles">
            <style>
                pre {
                    font-family: "JetBrains Mono", monospace;
                    font-optical-sizing: auto;
                    font-weight: normal;
                    font-style: normal;
                    box-sizing: border-box;
                    margin: 0;
                }

                .hljs {
                    color: #00f;
                    background: #fff;
                }
                .hljs-comment {
                    color: green;
                }
                .hljs-tag {
                    color: #444a;
                }
                .hljs-tag .hljs-attr,
                .hljs-tag .hljs-name {
                    color: #444;
                }
                .hljs-attribute,
                .hljs-doctag,
                .hljs-function,
                .hljs-keyword,
                .hljs-name,
                .hljs-punctuation,
                .hljs-selector-tag {
                    color: red;
                }
                .hljs-params,
                .hljs-type {
                    color: #00f;
                }
                .hljs-deletion,
                .hljs-number,
                .hljs-quote,
                .hljs-selector-class,
                .hljs-selector-id,
                .hljs-string,
                .hljs-symbol,
                .hljs-template-tag {
                    color: #000;
                }
                .hljs-section,
                .hljs-title {
                    color: #00f;
                }
                .hljs-link,
                .hljs-operator,
                .hljs-regexp,
                .hljs-selector-attr,
                .hljs-selector-pseudo,
                .hljs-template-variable,
                .hljs-variable {
                    color: #ab5656;
                }
                .hljs-literal {
                    color: red;
                }
                .hljs-addition,
                .hljs-built_in,
                .hljs-bullet,
                .hljs-code {
                    color: #00f;
                }
                .hljs-meta,
                .hljs-meta .hljs-keyword,
                .hljs-meta .hljs-string {
                    color: #963200;
                }
                .hljs-emphasis {
                    font-style: italic;
                }
                .hljs-strong {
                    font-weight: 700;
                }
            </style>
        </template>
        <div id="app"></div>
    </body>
</html>
